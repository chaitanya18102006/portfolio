<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — B. Krishna Chaitanya</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff1414'/%3E%3Cpath d='M18 14v36M18 34l20-20M24 30l18 20' stroke='%23fff' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=20261138">
</head>
<body>
  <!-- LOGIN -->
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="logo">K<span>_</span></div>
      <h1>Admin panel</h1>
      <p class="muted">Sign in to edit your portfolio.</p>
      <label class="lbl">Email<input type="email" id="loginEmail" required autocomplete="username"></label>
      <label class="lbl">Password<input type="password" id="loginPass" required autocomplete="current-password"></label>
      <div class="err" id="loginErr"></div>
      <button class="btn primary" type="submit">Sign in</button>
      <a class="muted small" href="index.html">← Back to site</a>
    </form>
  </div>

  <!-- APP -->
  <div class="shell" id="shell" hidden>
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
      <div class="brand"><span class="logo sm">K<span>_</span></span><b>Admin</b></div>
      <div class="status" id="status">All changes saved</div>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button class="btn ghost" id="previewBtn" type="button">Preview</button>
      <a class="btn ghost" href="index.html" target="_blank" rel="noopener">View site ↗</a>
      <button class="btn primary" id="saveBtn" type="button">Save &amp; Publish</button>
      <button class="btn ghost" id="logoutBtn" type="button">Log out</button>
    </header>

    <div class="banner" id="demoBanner" hidden>
      <b>Demo mode.</b> Firebase isn't configured yet, so changes are saved in this browser only and logins are skipped.
      Add your keys in <code>js/config.js</code> to go live.
    </div>

    <div class="body" id="body">
      <nav class="side" id="side"></nav>
      <main class="main" id="main"></main>
      <aside class="preview" id="preview">
        <div class="preview-bar">
          <b>Live preview</b>
          <div class="seg">
            <button type="button" data-w="100%" class="on">Desktop</button>
            <button type="button" data-w="390px">Mobile</button>
          </div>
        </div>
        <div class="frame-wrap"><iframe id="frame" src="index.html?preview=1" title="Site preview"></iframe></div>
      </aside>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/config.js?v=20261138"></script>
  <script src="js/icons.js?v=20261138"></script>
  <script src="js/defaults.js?v=20261138"></script>
  <script src="js/store.js?v=20261138"></script>
  <script src="js/admin.js?v=20261138"></script>
</body>
</html>
